<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Web AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030811;
            color: #00f0ff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            letter-spacing: 6px;
            font-size: 2.5rem;
            text-shadow: 0 0 15px #00f0ff;
        }

        /* Arc Reactor Central Visualizer */
        .arc-reactor {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 30px #00f0ff, inset 0 0 30px #00f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: rotate 10s linear infinite;
        }

        .inner-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px dashed #00f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core {
            width: 50px;
            height: 50px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffffff;
            transition: transform 0.3s ease;
        }

        /* Listening/Speaking Animation Effects */
        .arc-reactor.listening {
            animation: pulse 1s infinite alternate;
            border-color: #00ff66;
            box-shadow: 0 0 40px #00ff66, inset 0 0 40px #00ff66;
        }

        .arc-reactor.speaking .core {
            transform: scale(1.4);
            background: #ff0055;
            box-shadow: 0 0 30px #ff0055;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }

        /* Controls & Status */
        .status-box {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 15px 20px;
            border-radius: 12px;
            min-height: 60px;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        button {
            background: transparent;
            color: #00f0ff;
            border: 2px solid #00f0ff;
            padding: 12px 35px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #00f0ff;
            color: #030811;
            box-shadow: 0 0 25px #00f0ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>J.A.R.V.I.S</h1>

        <div class="arc-reactor" id="reactor">
            <div class="inner-ring">
                <div class="core"></div>
            </div>
        </div>

        <button onclick="startListening()">INITIALIZE VOICE</button>

        <div class="status-box" id="status">
            Click 'INITIALIZE VOICE' to give commands...
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('status');
        const reactor = document.getElementById('reactor');

        // Text To Speech (Voice Output)
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = 1.0;

            utterance.onstart = () => {
                reactor.classList.add('speaking');
            };

            utterance.onend = () => {
                reactor.classList.remove('speaking');
            };

            window.speechSynthesis.speak(utterance);
        }

        // Speech Recognition Setup
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Aapka browser Speech Recognition support nahi karta. Google Chrome use karein.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;

            recognition.onstart = () => {
                statusBox.innerText = "Listening...";
                reactor.classList.add('listening');
            };

            recognition.onresult = (event) => {
                reactor.classList.remove('listening');
                const command = event.results[0][0].transcript;
                statusBox.innerText = "You: " + command;
                processCommand(command.toLowerCase());
            };

            recognition.onerror = (event) => {
                reactor.classList.remove('listening');
                statusBox.innerText = "Error: " + event.error;
            };

            recognition.start();
        }

        // Command Processing Logic
        function processCommand(cmd) {
            let response = "";

            if (cmd.includes("hello") || cmd.includes("namaste")) {
                response = "Hello Sir! Main aapki kya madad kar sakta hoon?";
            } 
            else if (cmd.includes("time") || cmd.includes("samay")) {
                const now = new Date();
                response = "Abhi samay hua hai " + now.toLocaleTimeString();
            } 
            else if (cmd.includes("date") || cmd.includes("taarikh")) {
                const now = new Date();
                response = "Aaj ki taarikh hai " + now.toLocaleDateString();
            } 
            else if (cmd.includes("google kholo") || cmd.includes("open google")) {
                response = "Google open kar raha hoon";
                window.open("https://www.google.com", "_blank");
            } 
            else if (cmd.includes("youtube kholo") || cmd.includes("open youtube")) {
                response = "YouTube open kar raha hoon";
                window.open("https://www.youtube.com", "_blank");
            } 
            else {
                response = "Aapne kaha: " + cmd + ". Main is command ko process kar raha hoon.";
            }

            statusBox.innerText = "Jarvis: " + response;
            speak(response);
        }
    </script>
</body>
</html>
